# ============================================================================
# Proxy do Portal Spare num subcaminho (/portal-spare) — Apache e nginx
# ============================================================================
#
# O portal roda como serviço (uvicorn) em 127.0.0.1:8901 e é publicado em
# https://suporte.lojasrenner.com.br/portal-spare/ por este proxy.
#
# PROBLEMA QUE ISTO RESOLVE
# -------------------------
# As LEITURAS (GET) funcionavam, mas o botão "Atualizar (EBS)" (um POST) tomava
# 405 Method Not Allowed. Causa: uma regra que REDIRECIONA (301/302) em vez de
# PROXIAR. Num redirect, o navegador reenvia a requisição como GET — e o GET
# bate numa rota que só aceita POST → 405. A correção é PROXIAR (preservar o
# método e o corpo), nunca redirecionar.
#
# Regra de ouro: para o subcaminho do app, use ProxyPass (Apache) /
# proxy_pass (nginx). NUNCA use RewriteRule [R], Redirect ou return 301/302
# para levar a requisição ao backend.
#
# O serviço já resolve o prefixo sozinho: com APP_BASE_PATH=/portal-spare no
# environment (ou --root-path /portal-spare no uvicorn), ele injeta o
# <meta app-base> e prefixa os /static e /api. O proxy só precisa encaminhar.

# ----------------------------------------------------------------------------
# APACHE (mod_proxy, mod_proxy_http)  —  dentro do <VirtualHost *:443>
# ----------------------------------------------------------------------------
#   a2enmod proxy proxy_http headers
#
#   # As barras no fim dos DOIS lados têm de bater. Preservam o método (POST,
#   # PATCH, DELETE) e o corpo — sem redirect.
#   ProxyPreserveHost On
#   ProxyPass         /portal-spare/ http://127.0.0.1:8901/ retry=0
#   ProxyPassReverse  /portal-spare/ http://127.0.0.1:8901/
#
#   # (opcional) manda /portal-spare sem barra para /portal-spare/ com um
#   # redirect — vale SÓ para o GET da página inicial; NÃO ponha isto cobrindo
#   # /portal-spare/api, senão volta o 405 no POST.
#   RedirectMatch 308 ^/portal-spare$ /portal-spare/
#
#   # repassa o cabeçalho do prefixo (informativo; o app usa APP_BASE_PATH)
#   RequestHeader set X-Forwarded-Prefix "/portal-spare"
#
# ARMADILHAS a remover, se existirem no conf atual:
#   RewriteRule ^/portal-spare/(.*)$ http://127.0.0.1:8901/$1 [R]     # ERRADO (R = redirect)
#   Redirect /portal-spare/api ...                                     # ERRADO
#   <Location /portal-spare> ... <LimitExcept GET> ...                 # bloqueia POST

# ----------------------------------------------------------------------------
# NGINX  —  dentro do server { } (443)
# ----------------------------------------------------------------------------
#   location /portal-spare/ {
#       proxy_pass         http://127.0.0.1:8901/;   # a barra no fim REESCREVE o prefixo p/ raiz
#       proxy_http_version 1.1;
#       proxy_set_header   Host              $host;
#       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#       proxy_set_header   X-Forwarded-Prefix /portal-spare;
#       proxy_redirect     off;                       # não deixa o nginx reescrever p/ redirect
#   }
#
#   # (opcional) página inicial sem barra
#   location = /portal-spare { return 308 /portal-spare/; }
#
# ARMADILHAS no nginx:
#   - "rewrite ... permanent;" ou "return 301/302" para chegar ao backend → rebaixa POST.
#   - faltar a barra final em "proxy_pass http://127.0.0.1:8901;" faz o caminho
#     chegar COM /portal-spare no backend; aí use APP_BASE_PATH=/portal-spare
#     (o app trata) OU mantenha a barra final para reescrever para a raiz.

# ----------------------------------------------------------------------------
# COMO CONFIRMAR (sem depender do navegador)
# ----------------------------------------------------------------------------
#   # bate direto no serviço (sem passar pelo proxy): tem de responder o POST
#   # (401/403/200/502 — QUALQUER coisa menos 405):
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#     http://127.0.0.1:8901/api/controle-orcamento-exec/sincronizar
#
#   # bate pelo proxy: se aqui der 301/302/405 e o de cima não, o problema é o proxy.
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#     https://suporte.lojasrenner.com.br/portal-spare/api/controle-orcamento-exec/sincronizar
