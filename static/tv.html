<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de Operações — TV</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --ink: #1f2733;
            --muted: #6b7280;
            --border: #e6e8eb;
            --c-amber: #D97706;
            --c-blue: #2563EB;
            --c-emerald: #059669;
            --c-violet: #7C3AED;
            --c-pink: #DB2777;
            --c-cyan: #0891B2;
            --good: #16A34A;
            --warn: #D97706;
            --bad: #DC2626;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .shell { min-height: 100vh; padding: 28px 40px 36px; display: flex; flex-direction: column; gap: 24px; }

        /* Header */
        .head { display: flex; align-items: center; gap: 20px; }
        .logo {
            width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--c-blue), var(--c-cyan)); color: #fff; font-size: 24px;
        }
        .head h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
        .head .sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
        .head .spacer { flex: 1; }
        .clock { text-align: right; }
        .clock .time { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .clock .date { color: var(--muted); font-size: 14px; text-transform: capitalize; }
        .conn { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-left: 20px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
        .dot.green { background: var(--good); }
        .dot.red { background: var(--bad); }

        /* KPI cards */
        .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
        .kpi {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 18px 20px; border-left: 5px solid var(--muted);
            box-shadow: 0 1px 2px rgba(16,24,40,.04);
        }
        .kpi .lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .4px; }
        .kpi .val { font-size: 34px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .kpi.amber { border-left-color: var(--c-amber); } .kpi.amber .val { color: var(--c-amber); }
        .kpi.blue { border-left-color: var(--c-blue); } .kpi.blue .val { color: var(--c-blue); }
        .kpi.emerald { border-left-color: var(--c-emerald); } .kpi.emerald .val { color: var(--c-emerald); }
        .kpi.violet { border-left-color: var(--c-violet); } .kpi.violet .val { color: var(--c-violet); }
        .kpi.cyan { border-left-color: var(--c-cyan); } .kpi.cyan .val { color: var(--c-cyan); }
        .kpi.pink { border-left-color: var(--c-pink); } .kpi.pink .val { color: var(--c-pink); }

        /* Charts row */
        .charts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
        }
        .card h2 { margin: 0 0 14px; font-size: 17px; font-weight: 600; }
        .donut-wrap { display: flex; align-items: center; gap: 18px; }
        .donut { position: relative; width: 150px; height: 150px; flex: none; }
        .donut .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
        .donut .center b { font-size: 26px; font-weight: 700; }
        .donut .center span { display: block; color: var(--muted); font-size: 12px; }
        .legend { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .legend-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .legend-row .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
        .legend-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .legend-row .qt { font-weight: 700; font-variant-numeric: tabular-nums; }
        .legend-row .pc { color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
        .empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }

        /* Table */
        .tablecard { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 15px; }
        tbody tr:last-child td { border-bottom: none; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef2f7; color: #334155; }
        @media (max-width: 1100px) {
            .kpis { grid-template-columns: repeat(3, 1fr); }
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="head">
            <div class="logo">◧</div>
            <div>
                <h1 id="tv-title">Painel de Operações</h1>
                <div class="sub" id="tv-update">Carregando…</div>
            </div>
            <div class="spacer"></div>
            <div class="clock">
                <div class="time" id="tv-clock">--:--</div>
                <div class="date" id="tv-date"></div>
            </div>
            <div class="conn"><span class="dot" id="tv-dot"></span><span id="tv-state">Carregando…</span></div>
        </div>

        <div class="kpis" id="tv-kpis"></div>

        <div class="charts">
            <div class="card"><h2>Recebimentos por Categoria</h2><div id="tv-cat"></div></div>
            <div class="card"><h2>Distribuição por Status</h2><div id="tv-status"></div></div>
            <div class="card"><h2 id="tv-chart3-title">Indicadores</h2><div id="tv-chart3"></div></div>
        </div>

        <div class="card tablecard">
            <h2>Últimos Recebimentos</h2>
            <table>
                <thead><tr><th>Hora</th><th>Imobilizado</th><th>Descrição</th><th>Categoria</th><th>Status</th></tr></thead>
                <tbody id="tv-rows"></tbody>
            </table>
        </div>
    </div>

    <script>
    (function () {
        var timer;
        var PALETTE = ['#D97706', '#2563EB', '#059669', '#7C3AED', '#DB2777', '#0891B2'];
        var $ = function (s) { return document.querySelector(s); };
        var esc = function (s) {
            return String(s == null ? '' : s).replace(/[&<>'"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
            });
        };

        function clock() {
            var d = new Date();
            $('#tv-clock').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            $('#tv-date').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
        }

        function kpi(cls, label, value) {
            return '<div class="kpi ' + cls + '"><div class="lbl">' + esc(label) + '</div>' +
                '<div class="val">' + esc(value) + '</div></div>';
        }

        // Donut SVG: data = [{label, value}]. Colors from PALETTE by index.
        function donut(el, data, centerLabel) {
            var total = data.reduce(function (a, x) { return a + (x.value || 0); }, 0);
            if (!total) { el.innerHTML = '<div class="empty">Sem dados.</div>'; return; }
            var R = 15.9155, C = 2 * Math.PI * R, gap = 1.5;
            var off = 0, arcs = '';
            data.forEach(function (x, i) {
                var frac = x.value / total;
                var len = Math.max(0, frac * C - gap);
                arcs += '<circle cx="18" cy="18" r="' + R + '" fill="none" stroke="' +
                    PALETTE[i % PALETTE.length] + '" stroke-width="4" ' +
                    'stroke-dasharray="' + len + ' ' + (C - len) + '" ' +
                    'stroke-dashoffset="' + (-off) + '" transform="rotate(-90 18 18)"></circle>';
                off += frac * C;
            });
            var legend = data.map(function (x, i) {
                var pc = Math.round(x.value / total * 100);
                return '<div class="legend-row">' +
                    '<span class="sw" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
                    '<span class="nm" title="' + esc(x.label) + '">' + esc(x.label) + '</span>' +
                    '<span class="qt">' + x.value + '</span>' +
                    '<span class="pc">' + pc + '%</span></div>';
            }).join('');
            el.innerHTML = '<div class="donut-wrap">' +
                '<div class="donut"><svg viewBox="0 0 36 36" width="150" height="150">' +
                '<circle cx="18" cy="18" r="' + R + '" fill="none" stroke="#eef0f3" stroke-width="4"></circle>' +
                arcs + '</svg>' +
                '<div class="center"><div><b>' + total + '</b><span>' + esc(centerLabel || 'total') + '</span></div></div></div>' +
                '<div class="legend">' + legend + '</div></div>';
        }

        // Dados fictícios ALEATÓRIOS para validação de layout.
        // Ative com ?demo=1 (ou ?demo, ou #demo) na URL da TV.
        function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pick(arr) { return arr[rnd(0, arr.length - 1)]; }

        function demoData() {
            var cats = ['Coletor', 'SLED', 'Impressora', 'Notebook', 'Monitor', 'Outros'];
            var stats = ['RECEBIDO', 'EM TRIAGEM', 'ENVIADO LOJA', 'S/ REPARO', 'VENDA'];
            var modelos = [
                'Coletor Zebra TC22', 'Coletor Zebra TC52', 'SLED Honeywell CT60',
                'SLED Honeywell EDA52', 'Impressora Zebra ZD421', 'Impressora Zebra ZT411',
                'Notebook Dell Latitude 3440', 'Monitor Dell P2422H'
            ];
            var porCat = cats.map(function (c) { return { categoria: c, total: rnd(80, 1800) }; });
            var porStat = stats.map(function (s) { return { status: s, total: rnd(120, 1600) }; });

            var slaTotal = rnd(600, 1500);
            var slaMet = rnd(Math.round(slaTotal * 0.75), slaTotal);
            var slaBreached = slaTotal - slaMet;

            var ultimos = [];
            var agora = new Date();
            for (var i = 0; i < 8; i++) {
                var t = new Date(agora.getTime() - i * rnd(3, 9) * 60000);
                var cat = pick(cats);
                ultimos.push({
                    hora: t.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                    imobilizado: '1004' + rnd(10000, 99999),
                    descricao: pick(modelos),
                    categoria: cat,
                    status: pick(stats)
                });
            }

            return {
                config: { title: 'Painel de Operações — DEMO', interval: 8 },
                recebidos_hoje: rnd(8, 60),
                recebidos_mes: rnd(200, 700),
                recebidos_ano: rnd(3000, 8000),
                ativos_unicos: rnd(2500, 7000),
                por_categoria: porCat,
                por_status: porStat,
                indicadores: {
                    tickets_resolved: rnd(800, 1800),
                    sla_compliance_pct: Math.round(slaMet / slaTotal * 100),
                    sla_met: slaMet,
                    sla_breached: slaBreached,
                    sla_total: slaTotal
                },
                ultimos: ultimos,
                updated_at: new Date().toISOString()
            };
        }

        var DEMO = /(^|[?&])demo(=1)?(&|$)/.test(location.search) || /demo/.test(location.hash);
        if (DEMO) { console.log('[TV] modo DEMO ativo — dados aleatórios'); }

        async function load() {
            try {
                var d;
                if (DEMO) {
                    d = demoData();
                } else {
                    var r = await fetch('/api/tv/dashboard');
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    d = await r.json();
                }

                $('#tv-dot').className = 'dot green';
                $('#tv-state').textContent = 'Conectado';
                $('#tv-title').textContent = (d.config && d.config.title) || 'Painel de Operações';

                var ind = d.indicadores || null;
                var cards =
                    kpi('blue', 'Recebidos Hoje', d.recebidos_hoje) +
                    kpi('amber', 'Recebidos no Mês', d.recebidos_mes) +
                    kpi('emerald', 'Recebidos no Ano', d.recebidos_ano) +
                    kpi('violet', 'Ativos Únicos', d.ativos_unicos);
                if (ind) {
                    cards += kpi('cyan', 'Tickets Resolvidos', ind.tickets_resolved || 0);
                    cards += kpi('pink', 'SLA Conformidade', (ind.sla_compliance_pct || 0) + '%');
                }
                $('#tv-kpis').innerHTML = cards;

                donut($('#tv-cat'), (d.por_categoria || []).map(function (x) {
                    return { label: x.categoria, value: x.total };
                }), 'ativos');

                donut($('#tv-status'), (d.por_status || []).map(function (x) {
                    return { label: x.status, value: x.total };
                }), 'ciclos');

                // Terceiro gráfico: SLA (dentro x violado) se houver indicadores.
                if (ind && (ind.sla_total || 0) > 0) {
                    $('#tv-chart3-title').textContent = 'SLA — Dentro x Violado';
                    donut($('#tv-chart3'), [
                        { label: 'Dentro do prazo', value: ind.sla_met || 0 },
                        { label: 'Violados', value: ind.sla_breached || 0 }
                    ], 'chamados');
                } else {
                    $('#tv-chart3-title').textContent = 'Indicadores';
                    $('#tv-chart3').innerHTML = '<div class="empty">Sem indicadores do ServiceNow.<br>Atualize o cache em Parâmetros › TV.</div>';
                }

                $('#tv-rows').innerHTML = (d.ultimos || []).map(function (x) {
                    return '<tr><td>' + esc(x.hora) + '</td>' +
                        '<td><strong>' + esc(x.imobilizado) + '</strong></td>' +
                        '<td>' + esc(x.descricao) + '</td>' +
                        '<td>' + esc(x.categoria) + '</td>' +
                        '<td><span class="badge">' + esc(x.status) + '</span></td></tr>';
                }).join('') || '<tr><td colspan="5" class="empty">Nenhum recebimento recente.</td></tr>';

                var upd = new Date();
                $('#tv-update').textContent = 'Atualizado às ' +
                    upd.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                clearTimeout(timer);
                timer = setTimeout(load, ((d.config && d.config.interval) || 60) * 1000);
            } catch (e) {
                $('#tv-dot').className = 'dot red';
                $('#tv-state').textContent = 'Erro: ' + (e && e.message ? e.message : 'sem conexão');
                console.error('[TV] falha ao carregar dashboard:', e);
                timer = setTimeout(load, 15000);
            }
        }

        try { setInterval(clock, 1000); clock(); } catch (e) { console.error('[TV] relógio:', e); }
        load();
    })();
    </script>
</body>
</html>
