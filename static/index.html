<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal de Operações - SPARE</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/app.css">
    <script defer src="/static/app.js"></script>
</head>
<body>

<!-- ── Login screen ─────────────────────────────────────────── -->
<div id="login-screen" class="login-screen">
    <div class="login-card">
        <div class="login-logo-area">
            <div class="login-logo-icon">SP</div>
            <h1 class="login-title">Portal de Operações - SPARE</h1>
            <p class="login-subtitle">Operações de ativos</p>
        </div>
        <div class="login-type-selector">
            <button class="login-type-btn active" data-auth-type="AD">Logon AD</button>
            <button class="login-type-btn" data-auth-type="SSO">Logon Rede</button>
            <button class="login-type-btn" data-auth-type="LOCAL">Logon Local</button>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label>Usuário</label>
                <input id="login-username" class="form-control" autocomplete="username">
            </div>
            <div class="form-group mt-2">
                <label>Senha</label>
                <input id="login-password" type="password" class="form-control" autocomplete="current-password">
            </div>
            <button class="login-submit-btn" type="submit">Entrar</button>
        </form>
        <div id="login-error" class="login-error" hidden>
            <span>!</span> <span id="login-error-text"></span>
        </div>
        <div class="login-footer">SPARE - Portal de Operações</div>
    </div>
</div>

<!-- ── App wrapper ──────────────────────────────────────────── -->
<div id="app-wrapper" class="app-wrapper" hidden>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-icon">SP</div>
            <div class="sidebar-brand-text">SPARE</div>
        </div>
        <nav class="sidebar-menu">
            <a class="sidebar-item" data-route="bemvindo">
                <span class="sidebar-icon">&#x2302;</span>
                <span class="sidebar-label">Bem-vindo</span>
            </a>
            <a class="sidebar-item" data-route="consulta">
                <span class="sidebar-icon">&#x2315;</span>
                <span class="sidebar-label">Consulta</span>
            </a>
            <a class="sidebar-item" data-route="recebimento">
                <span class="sidebar-icon">&#x25A3;</span>
                <span class="sidebar-label">Recebimento</span>
            </a>
            <a class="sidebar-item" data-route="identificacao">
                <span class="sidebar-icon">&#x2399;</span>
                <span class="sidebar-label">Identificação</span>
            </a>
            <a class="sidebar-item" data-route="servicenow">
                <span class="sidebar-icon">&#x2601;</span>
                <span class="sidebar-label">ServiceNow</span>
            </a>
            <a class="sidebar-item" data-route="rastreio">
                <span class="sidebar-icon">&#x1F4E6;</span>
                <span class="sidebar-label">Correios</span>
            </a>
            <a class="sidebar-item" data-route="reparos">
                <span class="sidebar-icon">&#x2692;</span>
                <span class="sidebar-label">Central de Reparos</span>
            </a>
            <a class="sidebar-item" data-route="status">
                <span class="sidebar-icon">&#x2301;</span>
                <span class="sidebar-label">Status</span>
            </a>
            <a class="sidebar-item" data-route="parametros">
                <span class="sidebar-icon">&#x2699;</span>
                <span class="sidebar-label">Parâmetros</span>
            </a>
        </nav>
        <div class="sidebar-bottom">
            <button id="logout-btn" class="sidebar-logout-btn">
                <span>&#x21AA;</span>
                <span class="sidebar-label">Sair</span>
            </button>
        </div>
    </aside>

    <!-- Top bar -->
    <header class="topbar">
        <div class="topbar-left">
            <span id="app-title" class="topbar-app-title">Portal de Operações - SPARE</span>
        </div>
        <div class="topbar-center">
            <div class="topbar-search">
                <span class="topbar-search-icon">&#x2315;</span>
                <input id="global-search" class="topbar-search-input"
                       placeholder="Buscar ativo, etiqueta ou série">
            </div>
        </div>
        <div class="topbar-right">
            <div class="topbar-notifications">
                <span class="notif-dot notif-dot--blue"></span>
                <span class="notif-dot notif-dot--green"></span>
                <span class="notif-dot notif-dot--yellow"></span>
            </div>
            <span id="topbar-user-name" class="topbar-user-name"></span>
            <span id="topbar-user-avatar" class="topbar-user-avatar">U</span>
        </div>
    </header>

    <!-- Main content area -->
    <main class="main-content">
        <div id="sub-tabs" class="sub-tabs" hidden></div>
        <section id="page-content" class="page-content"></section>
        <footer id="portal-footer" class="login-footer">SPARE - Portal de Operações</footer>
    </main>

</div>

<!-- ── Toast container ──────────────────────────────────────── -->
<div id="toast-container" class="toast-container"></div>

<!-- ── Loading overlay ──────────────────────────────────────── -->
<div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-spinner">
        <span class="spinner spinner-lg"></span>
        <span class="loading-text">Processando...</span>
    </div>
</div>

<!-- ── Modal overlay ────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title" class="modal-title"></h3>
            <button id="modal-close-btn" class="modal-close-btn">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-footer" class="modal-footer"></div>
    </div>
</div>

</body>
</html>
