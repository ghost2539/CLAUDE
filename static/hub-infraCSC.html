<!-- Ícone PRÓPRIO do Hub: a marca "Malha" (três nós em triângulo), que
     cria parentesco com a malha da tela de login sem repetir o monograma
     do Spare. Cada portal tem a sua marca; o hub tem a dele.

     Vale SÓ nesta página. O portal continua com o /favicon.ico da rota
     dele, que serve o arquivo que o admin enviar — e é por isso que o
     caminho aqui não é /static/favicon.svg: `com_prefixo` troca ESSE nome
     exato pela rota do portal, e o ícone do hub viraria o do Spare. -->
<link rel="icon" href="/static/img/hub/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/img/hub/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/img/hub/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/static/img/hub/favicon-180.png">
<script src="/static/js/hub-infraCSC.js"></script>
<style>
/* ── Tokens ───────────────────────────────────────────────────────────
   Paleta do Template_LRSA_2025_online.pptx. Nenhum hex fora daqui.      */
:root {
  --pageBg:#0C0C0C; --text:#FFFFFF; --muted:#9A9A9A; --faint:#8C8C8C;
  --ruleFlat:#212121; --ruleFade:#2A2A2A;
  --toggleTrack:#232323; --toggleBorder:#333333; --toggleKnob:#C79105;
  --op-tinta:#E9D39B; --op-hover:#17140B;
  --ge-tinta:#5FB8AC; --ge-hover:#0D1716;
  --spare-tinta:#E0782F;
}
:root[data-tema="claro"] {
  --pageBg:#F4F4F4; --text:#000000; --muted:#4F4F4F; --faint:#6E6E6E;
  --ruleFlat:#DEDEDE; --ruleFade:#D2D2D2;
  --toggleTrack:#E4E4E4; --toggleBorder:#D0D0D0; --toggleKnob:#FFFFFF;
  --op-tinta:#7A5A03; --op-hover:#FBF6E9;
  --ge-tinta:#1C5A54; --ge-hover:#EDF4F3;
  --spare-tinta:#8E3B05;
}
/* Acentos cheios: iguais nos dois temas — é a cor que classifica o portal. */
:root { --op-acento:#C79105; --ge-acento:#246F68; --spare-acento:#AB4807; }

* { box-sizing:border-box; }
body {
  margin:0; background:var(--pageBg);
  font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased;
}
::selection { background:#E9D39B; color:#000000; }
a:focus-visible, button:focus-visible {
  outline:2px solid #C79105; outline-offset:-3px;
}

.folha { display:flex; flex-direction:column; min-height:100vh; }
.faixa { max-width:1200px; width:100%; margin:0 auto;
         /* 48px é a calha do desenho; num celular de 380px ela sozinha
            come 96px. clamp() encolhe sem media query. */
         padding:0 clamp(16px,4vw,48px); }

/* ── Header ─────────────────────────────────────────────────────────── */
header { border-bottom:1px solid var(--ruleFlat); flex:none; }
header .faixa {
  padding-top:18px; padding-bottom:18px;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px 28px; flex-wrap:wrap;
}
.assinatura { display:flex; align-items:center; gap:10px 20px;
              flex-wrap:wrap; min-width:0; }
.wordmark { display:block; width:196px; height:16px;
             object-fit:contain; object-position:left center; flex:none; }
:root[data-tema="claro"] .wordmark-escuro,
:root[data-tema="escuro"] .wordmark-claro { display:none; }
.filete-v { display:block; width:1px; height:24px; background:var(--ruleFlat); flex:none; }
.area { display:flex; flex-direction:column; gap:5px; min-width:0; }
.area b { font:bold 12px/1 Arial,Helvetica,sans-serif; letter-spacing:.2em; color:var(--text); }
.area span { font:400 10px/1 Arial,Helvetica,sans-serif; letter-spacing:.14em;
              text-transform:uppercase; color:var(--faint); }

/* ── Toggle ─────────────────────────────────────────────────────────── */
.toggle {
  position:relative; flex:none; width:48px; height:25px; padding:0;
  border:1px solid var(--toggleBorder); border-radius:999px;
  background:var(--toggleTrack); cursor:pointer;
  transition:background .2s, border-color .2s;
}
.knob {
  position:absolute; top:2px; left:2px; width:19px; height:19px;
  border-radius:50%; background:var(--toggleKnob);
  display:flex; align-items:center; justify-content:center;
  transition:transform .24s cubic-bezier(.2,.7,.2,1), background .2s;
}
:root[data-tema="escuro"] .knob { transform:translateX(23px); }
:root[data-tema="claro"] .icone-lua,
:root[data-tema="escuro"] .icone-sol { display:none; }

/* ── Conteúdo ───────────────────────────────────────────────────────── */
main { flex:1; }
main.faixa { padding-top:60px; padding-bottom:40px;
              display:flex; flex-direction:column; gap:56px; }
.titulo { display:flex; align-items:flex-end; justify-content:space-between;
           gap:32px 56px; flex-wrap:wrap; }
.titulo > div:first-child { display:flex; flex-direction:column; gap:22px;
                             min-width:0; flex:1 1 440px; }
.acento { display:block; width:44px; height:3px; background:#C79105; }
h1 { margin:0; font:bold 46px/1.04 Arial,Helvetica,sans-serif;
      font-size:clamp(30px,7vw,46px);
      letter-spacing:-.035em; color:var(--text); text-wrap:pretty; }
.contagem { font:400 11px/1 Arial,Helvetica,sans-serif; letter-spacing:.14em;
             text-transform:uppercase; color:var(--faint);
             flex:0 0 auto; padding-bottom:8px; }

/* ── Grupo ──────────────────────────────────────────────────────────── */
.grupo { display:flex; flex-direction:column; gap:4px; }
.grupo-cab { display:flex; align-items:center; gap:18px; padding-bottom:14px; }
.grupo-quadro { display:block; width:8px; height:8px; flex:none; }
.grupo-nome { font:bold 11px/1 Arial,Helvetica,sans-serif; letter-spacing:.22em;
               text-transform:uppercase; color:var(--text); white-space:nowrap; }
/* O filete esvanece nos últimos 22%: régua que para seca vira moldura. */
.grupo-regua { flex:1; height:1px; display:block;
  background:linear-gradient(90deg,var(--ruleFade) 0%,var(--ruleFade) 78%,transparent 100%); }
.grupo-conta { font:400 11px/1 Arial,Helvetica,sans-serif; color:var(--faint);
                white-space:nowrap; }

/* ── Linha de sistema ───────────────────────────────────────────────── */
/* Colunas FIXAS de propósito: com flex, um nome longo ("Controle de
   Orçamento") empurraria a descrição e quebraria a régua vertical que
   alinha todas as linhas. */
.linha {
  display:grid;
  grid-template-columns:32px minmax(min(180px,42vw),262px) minmax(0,1fr) 24px;
  align-items:center; gap:6px clamp(14px,2.4vw,26px);
  padding:24px 16px 24px 12px;
  text-decoration:none; color:inherit;
  transition:background .18s, box-shadow .18s, padding-left .18s;
}
.linha svg { display:block; width:30px; height:30px; }
.linha-nome { font:bold 23px/1.15 Arial,Helvetica,sans-serif; letter-spacing:-.025em;
               color:var(--text); min-width:0; overflow-wrap:anywhere; }
.linha-sub { font:400 13px/1.5 Arial,Helvetica,sans-serif; color:var(--muted);
              text-wrap:pretty; }
.linha-seta { font:400 19px/1 Arial,Helvetica,sans-serif; text-align:right; }
.separador { height:1px;
  background:linear-gradient(90deg,var(--ruleFlat) 0%,var(--ruleFlat) 78%,transparent 100%); }

/* Tinta por grupo (ícone e seta) e reação do hover na linha inteira. */
.op   { --tinta:var(--op-tinta);    --hover:var(--op-hover); --marca:var(--op-acento); }
.ge   { --tinta:var(--ge-tinta);    --hover:var(--ge-hover); --marca:var(--ge-acento); }
.spare{ --tinta:var(--spare-tinta); --hover:var(--op-hover); --marca:var(--spare-acento); }
.linha svg, .linha-seta { color:var(--tinta); fill:currentColor; }
a.linha:hover { background:var(--hover); box-shadow:inset 3px 0 0 var(--marca);
                 padding-left:20px; }

/* Portal ainda sem endereço: não é link, não tem seta, e diz por quê.
   Melhor do que sumir da lista — some e ninguém sabe que está vindo.

   A última coluna vira `auto` só nestas linhas: ela foi dimensionada em
   24px para caber uma seta, e "Em construção" pede 107px. Presa em 24px a
   etiqueta transbordava e empurrava a rolagem horizontal da PÁGINA INTEIRA,
   em qualquer largura. As colunas 1 e 2 seguem fixas, então a régua
   vertical que alinha nome e descrição não se mexe — quem cede é só a
   largura da descrição, nestas duas linhas. */
.linha.parado { opacity:.5; cursor:default;
  grid-template-columns:32px minmax(min(180px,42vw),262px) minmax(0,1fr) auto; }
.etiqueta { font:400 10px/1 Arial,Helvetica,sans-serif; letter-spacing:.14em;
             text-transform:uppercase; color:var(--faint); text-align:right; grid-column:4; }

/* ── Footer ─────────────────────────────────────────────────────────── */
footer { border-top:1px solid var(--ruleFlat); flex:none; }
footer .faixa { padding-top:20px; padding-bottom:20px;
  display:flex; align-items:center; justify-content:space-between;
  gap:8px 28px; flex-wrap:wrap;
  font:400 11px/1.4 Arial,Helvetica,sans-serif; color:var(--faint); }

.sem-script { padding:24px 0; }
.sem-script a { color:#C79105; display:block; padding:6px 0;
                 font:bold 16px/1.4 Arial,Helvetica,sans-serif; }

/* ÚNICA media query do arquivo, e ela contraria o handoff de propósito.
   O desenho previa "sem media queries", e isso vale até ~480px. Abaixo
   disso a conta não fecha: 32px de marca + 160 de nome + 107 da etiqueta
   "Em construção" + três vãos de 26 passam de 370px, e a página inteira
   ganha rolagem horizontal. Empilhar é o que resolve sem espremer a
   descrição até zero. Fora daqui, nada muda: a régua de quatro colunas
   segue valendo em 480px ou mais. */
@media (max-width:480px) {
  .linha, .linha.parado {
    grid-template-columns:32px minmax(0,1fr);
    gap:4px 14px; padding:20px 12px;
  }
  .linha-nome, .linha-sub, .linha-seta, .etiqueta { grid-column:2; }
  .linha-nome { font-size:20px; }
  /* A seta some: empilhada, ela cai numa linha só dela embaixo da
     descrição e fica órfã. A linha inteira é tocável, então não faz falta
     — já a etiqueta fica, porque é informação, não enfeite. */
  .linha-seta { display:none; }
  .etiqueta { text-align:left; }
  a.linha:hover { padding-left:16px; }
}
</style>
</head>
